<div class="card-container">
  
  <div class="header">
    <!-- <h2>Calories</h2> -->
    <!-- add day calneder -->
    <div class="calendar-container">
      <button>< </button>
      @for(calendar of  calendarDays(); track calendar.fullDate){
        <div
        class="day-item"
        [class.active-day] = calendar.isToday
        >
          <div class="day-name">{{calendar.dayName}}</div>
          <div class="day-number">{{calendar.dayNumber}}</div>
        </div>
      }
      <button> > </button>
     </div>
  </div>

  <!-- THE GAUGE (SVG) -->
  <div class="gauge-wrapper">
    <svg viewBox="0 0 300 180" class="gauge-svg">
      <!-- 
         Center Point: 150, 150
         Radius for ticks: ~110
      -->
      <g *ngFor="let tick of ticks()">
        <!-- Each tick is a rounded rectangle rotated around the center -->
        <rect 
          x="145" y="8" 
          width="10" height="45" 
          rx="4" ry="4"
          [attr.transform]="tick.rotation"
          [class.active-tick]="tick.active"
          class="tick"
        />
      </g>
    </svg>

    <!-- Center Content (Overlaid absolutely) -->
    <div class="gauge-center-content">
      <div class="fire-icon">
        &#x1F525;
      </div>
      <div class="main-count">{{ remainingCalories() }}</div>
      <div class="sub-label">Remaining</div>
    </div>
  </div>

  <!-- NUTRIENT ROW -->
  <div class="nutrient-row">
    
    <!-- Protein -->
    <div class="nutrient-item">
      <div class="icon-circle protein-bg">
        <!-- Apple Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-apple"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>
      </div>
      <div class="nutri-text">
        <div class="label">Protein</div>
        <div class="value">
          <span class="bold">{{ eatenProtein }}</span><span class="muted">/{{ targetProtein }}g</span>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="vertical-divider"></div>

    <!-- Carbs -->
    <div class="nutrient-item">
      <div class="icon-circle carbs-bg">
        <!-- Fork Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-utensils"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
      </div>
      <div class="nutri-text">
        <div class="label">Carbs</div>
        <div class="value">
            <span class="bold">{{ eatenCarbs }}</span><span class="muted">/{{ targetCarbs }}g</span>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="vertical-divider"></div>

    <!-- Fat -->
    <div class="nutrient-item">
      <div class="icon-circle fat-bg">
        <!-- Body Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="nutri-text">
        <div class="label">Fat</div>
        <div class="value">
            <span class="bold">{{ eatenFat }}</span><span class="muted">/{{ targetFat }}g</span>
        </div>
      </div>
    </div>

  </div>

</div>
