
<div class="bg-gray-800/50 dark:bg-gray-900/50 backdrop-blur-sm p-4 rounded-2xl border border-white/10 dark:border-white/5 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <div [innerHTML]="icon()" class="text-green-400 w-8 h-8"></div>
    <div>
      <p class="text-xs uppercase font-semibold text-gray-400 dark:text-gray-500">{{ title() }}</p>
      <p class="text-3xl font-bold text-white dark:text-gray-200">{{ steps() | number:'1.0-0' }}</p>
    </div>
  </div>
  <div class="text-right">
    <p class="text-sm font-semibold text-green-400">Goal: {{ (goal() / 1000) | number:'1.0-0' }}k</p>
    <p class="text-xs text-gray-400 dark:text-gray-500">Streak: {{ streak() }} days</p>
  </div>
</div>
