<section class="space-y-3 mt-3">
    <h3 class="text-[10px] font-black text-white/40 uppercase tracking-widest ml-2">{{sectionTitle}}</h3>
    <div class="glass-premium rounded-3xl overflow-hidden">
        @for(items of sectionItems; track  items.id) {
            <div class="flex items-center justify-between p-4 group active:bg-white/5 cursor-pointer">
                <div class="flex items-center gap-4">
                    <span class="material-symbols-outlined text-primary" style="font-size: 22px;">{{items.icon}}</span>
                    <span class="text-sm font-semibold tracking-wide">{{items.title}}</span>
                </div>
                @if(items?.hasToggle){
                    <div class="relative inline-block w-10 h-5 align-middle select-none">
                        <input [checked]="items.toggleState" (change)="items.toggleFunction()"
                            class="toggle-checkbox absolute block w-0 h-0 opacity-0" id="toggle-{{items.id}}" name="toggle"
                            type="checkbox" />
                        <label
                            class="toggle-label block overflow-hidden h-5 rounded-full bg-white/10 cursor-pointer transition-colors duration-200 border border-white/5"
                            for="toggle-{{items.id}}">
                            <span
                                class="toggle-dot block w-5 h-full rounded-full bg-white shadow-md transform transition-transform duration-200"></span>
                        </label>
                    </div>
                }@else{
                    <span class="material-symbols-outlined text-white/20 text-xl">chevron_right</span>
                }
            </div>
            <div class="h-[1px] w-full bg-white/5"></div>
        }
    </div>
</section>
