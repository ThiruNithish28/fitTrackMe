<div class="meal-container">
            <div class="meal-header">
                <div>
                    <!-- icon -->
                     <div class="title">{{title}}</div>
                </div>
                <div>
                    <!-- total carbs for this meal -->
                     <div class="totalCalorie">
                        {{totalCalorie}} kcal
                     </div>
                    <button class="addbtn" (click)="addFood()"> + </button>
                </div>
            </div>
            <div class="meal-content">
                @for(food of mealList; track food.id){
                    <div class="food-card">
                        <div class="name">{{food.name}}</div>
                        <div class="count-details" >
                            <div class="calories">{{food.calories}} Kcal</div>
                           
                            <div class="nutrition-container">
                                <div>P:{{food.protien}}</div>
                                <div>C:{{food.carbs}}</div>
                                <div>F:{{food.fat}}</div>
                            </div>

                        </div>
                    </div>
                }
            </div>
           
        </div>
