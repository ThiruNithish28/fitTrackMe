<header class="w-full flex justify-center items-center flex-col">
        <!-- Speech Bubble -->
        @if(message) {
            <div class="speech-bubble glass rounded-2xl px-4 py-3 mb-4 max-w-sm relative border border-white/5 animate-message-pop">
                <!-- Message content -->
                <p class="text-xs font-bold text-white/80 leading-relaxed">{{ message }}</p>
            </div>

            <!--  Message 2 --> 
             <!-- <div class="glass-premium rounded-2xl p-4 flex items-start gap-3 border-white/5 bg-primary/5"> <span class="material-symbols-outlined text-primary text-sm flex-shrink-0 mt-0.5">info</span> <div> <p class="text-[10px] font-black text-white/70 uppercase tracking-widest mb-1">Coach Tip</p> <p class="text-xs font-bold text-white leading-relaxed">Click <span class="text-primary font-black">'Current'</span> to log your daily weight with robot coach assistance.</p> </div> </div> -->
        }
        @if(mood === 'angry') {
            <!-- Angry Robot Coach -->
            <div class="robot robot--angry relative flex items-center justify-center size-24 mascot-glow-warning mb-4" role="img" aria-label="Angry Robot Coach">
                <div class="robot-face w-20 h-16 bg-zinc-900 rounded-4xl border-2 border-warning-neon/60 flex flex-col items-center justify-center relative overflow-hidden">
                    <div class="absolute inset-0 bg-linear-to-b from-warning-neon/10 to-transparent"></div>
                    <div class="robot-angry-eyes flex gap-4 z-10 pt-1">
                        <div class="robot-angry-eye w-4 h-1.5 bg-warning-neon rounded-full shadow-[0_0_10px_#ff4d4d] rotate-15 origin-right"></div>
                        <div class="robot-angry-eye w-4 h-1.5 bg-warning-neon rounded-full shadow-[0_0_10px_#ff4d4d] -rotate-15 origin-left"></div>
                    </div>
                    <div class="robot-mouth w-4 h-1.5 border-t border-warning-neon/40 mt-3 rounded-[100%]"></div>
                </div>
                <div class="robot-antenna absolute -top-1 w-1 h-3 bg-warning-neon/60 rounded-full shadow-neon-warning"></div>
            </div>
        } 
        @else {
            <!-- Robot Coach Face (neutral, proud, motivating) -->
            <div [class]="`robot w-16 h-16 rounded-2xl bg-background-dark border-2 border-primary/50 flex items-center justify-center neon-glow relative ${mood === 'proud' ? 'robot--proud' : mood === 'motivating' ? 'robot--motivating' : ''}`" role="img" aria-label="Robot Coach">
                <div class="robot-eyes flex gap-2">
                    <div class="robot-eye w-2 h-4 bg-primary rounded-full animate-pulse"></div>
                    <div class="robot-eye w-2 h-4 bg-primary rounded-full animate-pulse"></div>
                </div>
                <!-- Robot Antenna -->
                <div class="robot-antenna absolute -top-1 left-1/2 -translate-x-1/2 w-1 h-3 bg-primary/40 rounded-full"></div>

                @if(mood === 'proud') {
                    <!-- Proud badge / chest puff -->
                    <div class="robot-badge absolute bottom-0 -mb-2 w-6 h-2 bg-amber-400 rounded-full shadow-neon-proud"></div>
                }

                @if(mood === 'motivating') {
                    <!-- Motivating sparkles -->
                    <div class="robot-sparkles absolute -top-3 -right-2 flex flex-col items-end gap-1 pointer-events-none">
                        <div class="sparkle w-1.5 h-1.5 bg-primary rounded-full"></div>
                        <div class="sparkle w-1 h-1 bg-primary rounded-full"></div>
                    </div>
                }
            </div>
        }
    </header>
