<div class="relative flex items-center justify-center size-64">
  <svg class="size-full -rotate-45 transform" viewBox="0 0 256 256">
    <!-- Background Circle -->
    <circle cx="128" cy="128" [attr.r]="radius" stroke-width="12" fill="none" class="stroke-white/5"></circle>
    <!-- Progress Circle -->
    <circle cx="128" cy="128" [attr.r]="radius" stroke-width="12" fill="none" stroke-linecap="round"
      [style.strokeDasharray]="circumference" [style.strokeDashoffset]="strokeDashoffset()"
      class="stroke-primary progress-ring-glow transition-all duration-1000 ease-out"></circle>
  </svg>
  
  <div class="absolute flex flex-col items-center justify-center text-center">
<div class="flex flex-col items-center justify-center text-center">
    <div
      class="w-12 h-10 mb-2 bg-zinc-900 rounded-xl border border-primary/60 flex flex-col items-center justify-center mascot-glow">
      <div class="flex gap-2">
        <div class="w-2.5 h-1 bg-primary shadow-[0_0_8px_#30e87a] rotate-12"></div>
        <div class="w-2.5 h-1 bg-primary shadow-[0_0_8px_#30e87a] -rotate-12"></div>
      </div>
    </div>
  </div>

 <div class="flex flex-col items-center justify-center text-center">
    <span class="text-4xl font-black text-white neon-text tracking-tighter">
      {{ caloriesLeft() | number:'1.0-0' }}
    </span>
    <span class="text-xs font-medium text-primary/80 uppercase tracking-widest">
      Cals Left
    </span>
  </div>
  </div>

  


 
</div>
