<div (click)="onClickHandler.emit(item)" class="glass food-card-glass flex items-center p-3 gap-4 rounded-2xl border-l-4 border-primary/40 group hover:border-primary transition-all cursor-pointer">
                <div class="size-20 shrink-0 bg-center bg-no-repeat bg-cover rounded-xl shadow-lg" [style.background-image]="'url(' + item.imageUrl + ')'"></div>
                <div class="flex-1 min-w-0">
                    <h3 class="text-white font-extrabold text-base truncate uppercase tracking-tight leading-tight">{{ item.name }}</h3>
                    <p class="text-white/40 text-[10px] font-bold uppercase mt-0.5">{{ item.protein }}g Protein • {{ item.calories }} Cal</p>
                    @if(item.verified) {
                        <div class="flex items-center gap-1 mt-2">
                            <span class="material-symbols-outlined text-primary size-4" style="font-size: 14px;">verified</span>
                            <span class="text-[10px] text-primary/80 font-medium">Verified Nutrients</span>
                        </div>
                    } @else if (item.lastLogged) {
                        <div class="flex items-center gap-1 mt-2">
                            <span class="material-symbols-outlined text-white/20 size-4" style="font-size: 14px;">history</span>
                            <span class="text-[10px] text-white/30 font-medium">Last logged {{ item.lastLogged }}</span>
                        </div>
                    }
                </div>
                <button class="size-10 flex items-center justify-center rounded-xl bg-primary/10 text-primary border border-primary/20 hover:bg-primary hover:text-background-dark transition-all">
                    <span class="material-symbols-outlined font-bold">add</span>
                </button>
            </div>
